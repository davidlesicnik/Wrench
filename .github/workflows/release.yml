name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The obsolete tools package is no longer available from Google.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify version against published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-release-version.py

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ENCODED_STRING" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          printf '%s' "$ENCODED_STRING" | base64 -d > release-keystore.jks
          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract version
        id: version
        run: |
          versionName=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version_name=$versionName" >> "$GITHUB_OUTPUT"

      - name: Prepare APK artifact
        id: artifact
        run: |
          apk_dir="app/build/outputs/apk/release"
          if [ -f "$apk_dir/app-release.apk" ]; then
            apk_path="$apk_dir/app-release.apk"
          else
            shopt -s nullglob
            apks=("$apk_dir"/*.apk)
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "Expected exactly one release APK; found ${#apks[@]}"
              exit 1
            fi
            apk_path="${apks[0]}"
          fi
          out="wrench-v${{ steps.version.outputs.version_name }}.apk"
          cp "$apk_path" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Wrench v${{ steps.version.outputs.version_name }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.apk }}
